<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZWR4FHPSWG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-ZWR4FHPSWG');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Practice whiteboard challenges across Product & UX Design, Marketing & Growth, Sales & Pitching, Strategy & Operations, and Data & Analytics. Choose your difficulty level and sharpen your skills.">
    <meta name="keywords" content="practice whiteboard challenge, design practice, product design exercise, interview practice, design challenge practice">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.whiteboarddojo.com/dojo/">
    <meta property="og:title" content="The Dojo - Whiteboard Dojo">
    <meta property="og:description" content="Practice whiteboard challenges across Product & UX Design, Marketing & Growth, Sales & Pitching, Strategy & Operations, and Data & Analytics.">
    <meta property="og:image" content="https://www.whiteboarddojo.com/images/logo.svg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://www.whiteboarddojo.com/dojo/">
    <meta property="twitter:title" content="The Dojo - Whiteboard Dojo">
    <meta property="twitter:description" content="Practice whiteboard challenges across Product & UX Design, Marketing & Growth, Sales & Pitching, Strategy & Operations, and Data & Analytics.">
    <meta property="twitter:image" content="https://www.whiteboarddojo.com/images/logo.svg">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.whiteboarddojo.com/dojo/">

    <title>The Dojo - Whiteboard Dojo</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="../" class="logo">
                <img src="../images/logo.svg" alt="Whiteboard Dojo Logo" class="logo-image">
                <span class="logo-text">Whiteboard Dojo</span>
            </a>
            <ul class="nav-links">
                <li><a href="../" class="nav-link">Home</a></li>
                <li><a href="./" class="nav-link active">Dojo</a></li>
                <li><a href="../docs/" class="nav-link">Docs</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <!-- Dojo Section -->
        <section class="dojo-section" id="dojo-section">
            <div class="dojo-header">
                <h1 class="dojo-title">The Dojo</h1>
                <p class="dojo-subtitle">Practice with purpose & sharpen your skills. New here? Check out the <a href="../docs/running-solo-practice-sessions.html" class="nav-link">docs →</a></p>
            </div>

            <div class="challenge-generator">
                <!-- Category Selector Row -->
                <div class="selectors-row category-row">
                    <div class="selector-section">
                        <label class="selector-label">Category:</label>
                        <div class="selector-buttons">
                            <button class="selector-btn category-btn active" data-category="all">All</button>
                            <button class="selector-btn category-btn" data-category="product-ux-design">Product & UX Design</button>
                            <button class="selector-btn category-btn" data-category="marketing-growth">Marketing & Growth</button>
                            <button class="selector-btn category-btn" data-category="sales-pitching">Sales & Pitching</button>
                            <button class="selector-btn category-btn" data-category="strategy-operations">Strategy & Operations</button>
                            <button class="selector-btn category-btn" data-category="data-analytics">Data & Analytics</button>
                        </div>
                    </div>
                </div>

                <!-- Level Selector and Generate Button Row -->
                <div class="level-and-button-row">
                    <div class="selectors-row level-row">
                        <div class="selector-section">
                            <label class="selector-label">Level:</label>
                            <div class="selector-buttons">
                                <button class="selector-btn difficulty-btn active" data-difficulty="beginner">Beginner</button>
                                <button class="selector-btn difficulty-btn" data-difficulty="intermediate">Intermediate</button>
                                <button class="selector-btn difficulty-btn" data-difficulty="advanced">Advanced</button>
                            </div>
                        </div>
                    </div>
                    <button class="button button-primary generate-btn" id="new-challenge-btn">
                        <span class="generate-icon">⚡</span>
                        Generate New Challenge
                    </button>
                </div>

                <!-- Challenge Display (Full Width) -->
                <div class="challenge-display">
                    <div class="challenge-content" id="challenge-content">
                        <div class="challenge-placeholder">
                            <span class="placeholder-text">Click "Generate New Challenge" to generate your practice challenge</span>
                        </div>
                    </div>
                </div>

                <!-- Timer Controls (Bottom, Centered) -->
                <div class="timer-section">
                    <div class="timer-controls-wrapper">
                        <div class="timer-input-group-compact">
                            <button class="timer-adjust-btn" id="decrease-timer-btn">−</button>
                            <div class="timer-display-text" id="timer-display">20:00</div>
                            <button class="timer-adjust-btn" id="increase-timer-btn">+</button>
                        </div>
                        <div class="timer-action-buttons">
                            <button class="button button-secondary timer-btn" id="start-timer-btn" disabled>Start</button>
                            <button class="button button-secondary timer-btn" id="pause-timer-btn" disabled>Pause</button>
                            <button class="button button-secondary timer-btn" id="reset-timer-btn">Reset</button>
                            <button class="button button-primary timer-btn go-to-whiteboard-btn" id="go-to-whiteboard-btn" disabled>🎨 Go to Whiteboard</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="../js/dojo.js"></script>
</body>
</html>
