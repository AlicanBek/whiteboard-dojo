<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Space Grotesk','Inter',sans-serif" role="img" aria-label="Whiteboard Dojo canvas preview">
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="1000" height="600" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- App frame -->
    <rect x="0" y="0" width="1000" height="600" rx="16" fill="#1a1a1a"/>

    <!-- Toolbar -->
    <rect x="0" y="0" width="1000" height="56" fill="#1a1a1a"/>
    <line x1="0" y1="56" x2="1000" y2="56" stroke="#3a3a3a" stroke-width="1"/>

    <!-- Tool group: select / draw / text -->
    <g transform="translate(20,12)">
      <rect width="32" height="32" rx="7" fill="#E32727"/>
      <text x="16" y="22" text-anchor="middle" font-size="16" fill="#fff">↖</text>
      <rect x="38" width="32" height="32" rx="7" fill="#262626"/>
      <text x="54" y="22" text-anchor="middle" font-size="15" fill="#c4c4c4">✏</text>
      <rect x="76" width="32" height="32" rx="7" fill="#262626"/>
      <text x="92" y="22" text-anchor="middle" font-size="14" fill="#c4c4c4" font-weight="700">T</text>
    </g>

    <!-- Shapes group -->
    <g transform="translate(150,12)">
      <rect width="32" height="32" rx="7" fill="#262626"/>
      <text x="16" y="23" text-anchor="middle" font-size="16" fill="#c4c4c4">▭</text>
      <rect x="38" width="32" height="32" rx="7" fill="#262626"/>
      <text x="54" y="23" text-anchor="middle" font-size="15" fill="#c4c4c4">○</text>
      <rect x="76" width="32" height="32" rx="7" fill="#262626"/>
      <text x="92" y="23" text-anchor="middle" font-size="15" fill="#c4c4c4">△</text>
      <rect x="114" width="32" height="32" rx="7" fill="#262626"/>
      <text x="130" y="23" text-anchor="middle" font-size="15" fill="#c4c4c4">→</text>
      <rect x="152" width="32" height="32" rx="7" fill="#262626"/>
      <text x="168" y="24" text-anchor="middle" font-size="16" fill="#c4c4c4">★</text>
    </g>

    <!-- Color presets -->
    <g transform="translate(380,18)">
      <circle cx="10" cy="10" r="9" fill="#000000" stroke="#505050"/>
      <circle cx="34" cy="10" r="9" fill="#ffffff"/>
      <circle cx="58" cy="10" r="11" fill="#E32727" stroke="#fff" stroke-width="2"/>
      <circle cx="82" cy="10" r="9" fill="#ff8c00"/>
      <circle cx="106" cy="10" r="9" fill="#22c55e"/>
      <circle cx="130" cy="10" r="9" fill="#3b82f6"/>
      <circle cx="154" cy="10" r="9" fill="#a855f7"/>
    </g>

    <!-- Action buttons -->
    <g transform="translate(820,12)" fill="#262626">
      <rect width="32" height="32" rx="7"/>
      <rect x="38" width="32" height="32" rx="7"/>
      <rect x="84" width="56" height="32" rx="7" fill="#E32727"/>
      <text x="16" y="22" text-anchor="middle" font-size="15" fill="#c4c4c4">↶</text>
      <text x="54" y="22" text-anchor="middle" font-size="15" fill="#c4c4c4">↷</text>
      <text x="112" y="21" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">Export</text>
    </g>

    <!-- Canvas -->
    <rect x="24" y="80" width="952" height="496" rx="12" fill="#ffffff"/>

    <!-- ===== A credible product sketch: wireframe → activation funnel → growth ===== -->

    <!-- Section heading -->
    <text x="70" y="128" font-size="22" fill="#1f2937" font-weight="600">Activation funnel</text>
    <line x1="70" y1="138" x2="258" y2="138" stroke="#E32727" stroke-width="3" stroke-linecap="round"/>

    <!-- Wireframe card -->
    <g>
      <rect x="70" y="170" width="220" height="190" rx="8" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
      <line x1="70" y1="200" x2="290" y2="200" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="86" cy="185" r="4" fill="#3b82f6"/>
      <circle cx="100" cy="185" r="4" fill="#3b82f6"/>
      <circle cx="114" cy="185" r="4" fill="#3b82f6"/>
      <!-- content lines -->
      <rect x="88" y="218" width="120" height="12" rx="3" fill="#e5e7eb"/>
      <rect x="88" y="240" width="184" height="8" rx="3" fill="#eef0f2"/>
      <rect x="88" y="256" width="160" height="8" rx="3" fill="#eef0f2"/>
      <!-- image placeholder -->
      <rect x="88" y="278" width="88" height="58" rx="4" fill="none" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="88" y1="278" x2="176" y2="336" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="176" y1="278" x2="88" y2="336" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- CTA button -->
      <rect x="190" y="300" width="84" height="34" rx="6" fill="#E32727"/>
      <text x="232" y="322" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">Sign up</text>
    </g>

    <!-- arrow from wireframe to flow -->
    <line x1="300" y1="230" x2="358" y2="210" stroke="#1f2937" stroke-width="2.5"/>
    <path d="M358 210 l-15 -3 6 13 z" fill="#1f2937"/>

    <!-- Funnel nodes -->
    <g font-size="16" fill="#1f2937">
      <rect x="370" y="175" width="150" height="50" rx="8" fill="none" stroke="#1f2937" stroke-width="2.5"/>
      <text x="445" y="206" text-anchor="middle" font-weight="500">Visitor</text>

      <rect x="370" y="290" width="150" height="50" rx="8" fill="none" stroke="#1f2937" stroke-width="2.5"/>
      <text x="445" y="321" text-anchor="middle" font-weight="500">Onboarding</text>

      <rect x="615" y="290" width="160" height="50" rx="8" fill="none" stroke="#1f2937" stroke-width="2.5"/>
      <text x="695" y="321" text-anchor="middle" font-weight="500">Activated ✓</text>
    </g>

    <!-- arrow Visitor -> Onboarding -->
    <line x1="445" y1="225" x2="445" y2="288" stroke="#1f2937" stroke-width="2.5"/>
    <path d="M445 290 l-6 -13 12 0 z" fill="#1f2937"/>
    <!-- arrow Onboarding -> Activated -->
    <line x1="520" y1="315" x2="613" y2="315" stroke="#1f2937" stroke-width="2.5"/>
    <path d="M615 315 l-13 -6 0 12 z" fill="#1f2937"/>

    <!-- annotation -->
    <text x="535" y="262" font-size="14" fill="#E32727" font-style="italic">biggest drop-off here</text>
    <path d="M538 268 q-30 18 -78 22" fill="none" stroke="#E32727" stroke-width="1.6" stroke-dasharray="4 4"/>

    <!-- Mini growth chart -->
    <g>
      <line x1="615" y1="400" x2="615" y2="500" stroke="#1f2937" stroke-width="2"/>
      <line x1="615" y1="500" x2="900" y2="500" stroke="#1f2937" stroke-width="2"/>
      <polyline points="628,488 672,470 716,476 762,448 812,430 862,406" fill="none" stroke="#E32727" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="762" cy="448" r="4" fill="#E32727"/>
      <circle cx="862" cy="406" r="4" fill="#E32727"/>
      <text x="624" y="392" font-size="13" fill="#6b7280">activation %</text>
      <text x="780" y="520" font-size="13" fill="#6b7280">weeks</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="999" height="599" rx="16" fill="none" stroke="#3a3a3a" stroke-width="1"/>
</svg>
