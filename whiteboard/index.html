<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->

    <script>
      window.dataLayer = window.dataLayer || [];

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free online whiteboard for drawing, creating shapes, and adding text. Perfect for brainstorming, wireframing, and visual thinking.">
    <meta name="keywords" content="whiteboard, online whiteboard, drawing tool, shapes, design tool, brainstorming, wireframe">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.whiteboarddojo.com/whiteboard/">
    <meta property="og:title" content="Whiteboard - Whiteboard Dojo">
    <meta property="og:description" content="Free online whiteboard for drawing, creating shapes, and adding text. Perfect for brainstorming, wireframing, and visual thinking.">
    <meta property="og:image" content="https://www.whiteboarddojo.com/images/logo.svg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://www.whiteboarddojo.com/whiteboard/">
    <meta property="twitter:title" content="Whiteboard - Whiteboard Dojo">
    <meta property="twitter:description" content="Free online whiteboard for drawing, creating shapes, and adding text. Perfect for brainstorming, wireframing, and visual thinking.">
    <meta property="twitter:image" content="https://www.whiteboarddojo.com/images/logo.svg">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.whiteboarddojo.com/whiteboard/">

    <title>Whiteboard - Whiteboard Dojo</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">

    <!-- Fabric.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
</head>
<body>
    <main class="whiteboard-container">
        <!-- Toolbar Section -->
        <section class="whiteboard-toolbar">
            <div class="toolbar-section">
                <a href="../dojo/" class="button button-primary dojo-back-btn">← Dojo</a>
            </div>

            <div class="toolbar-section">
                <div class="toolbar-buttons">
                    <button class="selector-btn tool-btn active" data-tool="select" title="Select and move objects (V)">
                        <span class="tool-icon">↖</span>
                    </button>
                    <button class="selector-btn tool-btn" data-tool="draw" title="Free draw (B)">
                        <span class="tool-icon">✏</span>
                    </button>
                    <button class="selector-btn tool-btn" data-tool="text" title="Add text (T)">
                        <span class="tool-icon">T</span>
                    </button>
                </div>
            </div>

            <div class="toolbar-section">
                <div class="toolbar-buttons">
                    <button class="selector-btn shape-btn" data-shape="rectangle" title="Rectangle">
                        <span class="tool-icon">▭</span>
                    </button>
                    <button class="selector-btn shape-btn" data-shape="circle" title="Circle">
                        <span class="tool-icon">○</span>
                    </button>
                    <button class="selector-btn shape-btn" data-shape="triangle" title="Triangle">
                        <span class="tool-icon">△</span>
                    </button>
                    <button class="selector-btn shape-btn" data-shape="line" title="Line">
                        <span class="tool-icon">—</span>
                    </button>
                    <button class="selector-btn shape-btn" data-shape="arrow" title="Arrow">
                        <span class="tool-icon">→</span>
                    </button>
                    <button class="selector-btn shape-btn" data-shape="star" title="Star">
                        <span class="tool-icon">★</span>
                    </button>
                </div>
            </div>

            <div class="toolbar-section">
                <label class="toolbar-label">Shape Fill:</label>
                <button class="fill-radio-btn" id="fill-toggle-btn" title="Toggle shape fill" data-fill="stroke">
                    <span class="radio-circle"></span>
                </button>
            </div>

            <div class="toolbar-section">
                <div class="color-controls">
                    <div class="color-presets">
                        <button class="color-preset" data-color="#000000" style="background: #000000;" title="Black"></button>
                        <button class="color-preset" data-color="#ffffff" style="background: #ffffff; border: 1px solid #ccc;" title="White"></button>
                        <button class="color-preset active" data-color="#E32727" style="background: #E32727;" title="Red"></button>
                        <button class="color-preset" data-color="#ff8c00" style="background: #ff8c00;" title="Orange"></button>
                        <button class="color-preset" data-color="#22c55e" style="background: #22c55e;" title="Green"></button>
                        <button class="color-preset" data-color="#3b82f6" style="background: #3b82f6;" title="Blue"></button>
                        <button class="color-preset" data-color="#ffb300" style="background: #ffb300;" title="Yellow"></button>
                        <button class="color-preset" data-color="#a855f7" style="background: #a855f7;" title="Purple"></button>
                    </div>
                    <input type="color" id="color-picker" class="color-picker" value="#E32727">
                </div>
            </div>

            <div class="toolbar-section">
                <label class="toolbar-label">Stroke:</label>
                <input type="range" id="stroke-width" class="stroke-slider" min="1" max="20" value="2">
                <span id="stroke-value" class="stroke-value">2px</span>
            </div>

            <div class="toolbar-section toolbar-actions">
                <button class="button button-secondary toolbar-btn" id="undo-btn" title="Undo (Ctrl+Z)" disabled>
                    ↶
                </button>
                <button class="button button-secondary toolbar-btn" id="redo-btn" title="Redo (Ctrl+Y)" disabled>
                    ↷
                </button>
                <button class="button button-secondary toolbar-btn" id="delete-btn" title="Delete (Del)">
                    🗑
                </button>
                <button class="button button-secondary toolbar-btn" id="clear-btn" title="Clear All">
                    ✕
                </button>
                <button class="button button-primary toolbar-btn" id="export-btn" title="Export PNG (Ctrl+S)">
                    💾
                </button>
            </div>
        </section>

        <!-- Canvas Area -->
        <section class="whiteboard-canvas-section">
            <div class="canvas-wrapper">
                <canvas id="whiteboard-canvas"></canvas>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>
    <script src="../js/footer.js"></script>
    <script src="../js/whiteboard.js"></script>
</body>
</html>
