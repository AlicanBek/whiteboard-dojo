    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free online whiteboard for drawing, creating shapes, and adding text. Perfect for brainstorming, wireframing, and visual thinking.">
    <meta name="keywords" content="whiteboard, online whiteboard, drawing tool, shapes, design tool, brainstorming, wireframe">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.whiteboarddojo.com/whiteboard/">
    <meta property="og:title" content="Whiteboard - Whiteboard Dojo">
    <meta property="og:description" content="Free online whiteboard for drawing, creating shapes, and adding text. Perfect for brainstorming, wireframing, and visual thinking.">
    <meta property="og:image" content="https://www.whiteboarddojo.com/images/logo.svg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://www.whiteboarddojo.com/whiteboard/">
    <meta property="twitter:title" content="Whiteboard - Whiteboard Dojo">
    <meta property="twitter:description" content="Free online whiteboard for drawing, creating shapes, and adding text. Perfect for brainstorming, wireframing, and visual thinking.">
    <meta property="twitter:image" content="https://www.whiteboarddojo.com/images/logo.svg">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.whiteboarddojo.com/whiteboard/">

    <title>Whiteboard - Whiteboard Dojo</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">

    <!-- Fabric.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
</head>
<body class="wb-body">
    <div class="wb-app">
        <!-- Full-bleed canvas -->
        <div class="wb-canvas-host">
            <canvas id="whiteboard-canvas"></canvas>
        </div>

        <!-- Top-right: actions -->
        <div class="wb-float wb-topright">
            <a href="../dojo/" class="button button-secondary wb-challenge-btn">🎲 Get a challenge</a>
            <span class="wb-divider"></span>
            <button class="wb-icon-btn" id="undo-btn" title="Undo (Ctrl+Z)" disabled>↶</button>
            <button class="wb-icon-btn" id="redo-btn" title="Redo (Ctrl+Y)" disabled>↷</button>
            <button class="wb-icon-btn" id="delete-btn" title="Delete (Del)">🗑</button>
            <button class="wb-icon-btn" id="clear-btn" title="Clear all">✕</button>
            <button class="button button-primary wb-export-btn" id="export-btn" title="Export PNG (Ctrl+S)">💾 Export</button>
        </div>

        <!-- Left panel: brand + tools + shapes + fill + color + stroke -->
        <div class="wb-float wb-panel">
            <div class="wb-panel-brand">
                <a href="../" class="wb-logo" title="Whiteboard Dojo — Home">
                    <img src="../images/logo.svg" alt="Whiteboard Dojo Logo">
                </a>
            </div>

            <span class="wb-panel-divider"></span>

            <div class="wb-tool-grid">
                <button class="selector-btn tool-btn active" data-tool="select" title="Select (V)">
                    <span class="tool-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.037 4.688a.5.5 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/></svg></span>
                </button>
                <button class="selector-btn tool-btn" data-tool="draw" title="Draw (B)">
                    <span class="tool-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg></span>
                </button>
                <button class="selector-btn tool-btn" data-tool="text" title="Text (T)">
                    <span class="tool-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg></span>
                </button>
            </div>

            <span class="wb-panel-divider"></span>

            <div class="wb-shape-grid">
                <button class="selector-btn shape-btn" data-shape="rectangle" title="Rectangle">
                    <span class="tool-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/></svg></span>
                </button>
                <button class="selector-btn shape-btn" data-shape="circle" title="Circle">
                    <span class="tool-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg></span>
                </button>
                <button class="selector-btn shape-btn" data-shape="triangle" title="Triangle">
                    <span class="tool-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/></svg></span>
                </button>
                <button class="selector-btn shape-btn" data-shape="line" title="Line">
                    <span class="tool-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/></svg></span>
                </button>
                <button class="selector-btn shape-btn" data-shape="arrow" title="Arrow">
                    <span class="tool-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg></span>
                </button>
                <button class="selector-btn shape-btn" data-shape="star" title="Star">
                    <span class="tool-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 14.85 8.52 21.96 9.27 16.7 14.04 18.18 21.02 12 17.27 5.82 21.02 7.3 14.04 2.04 9.27 9.15 8.52 12 2"/></svg></span>
                </button>
            </div>

            <span class="wb-panel-divider"></span>

            <div class="wb-fill-row">
                <button class="fill-radio-btn" id="fill-toggle-btn" title="Toggle shape fill" data-fill="stroke">
                    <span class="radio-circle"></span>
                </button>
                <span class="wb-panel-label">Fill</span>
            </div>

            <span class="wb-panel-divider"></span>

            <div class="color-presets">
                <button class="color-preset" data-color="#18181b" style="background: #18181b;" title="Ink"></button>
                <button class="color-preset" data-color="#ffffff" style="background: #ffffff;" title="White"></button>
                <button class="color-preset active" data-color="#E32727" style="background: #E32727;" title="Red"></button>
                <button class="color-preset" data-color="#f97316" style="background: #f97316;" title="Orange"></button>
                <button class="color-preset" data-color="#f59e0b" style="background: #f59e0b;" title="Amber"></button>
                <button class="color-preset" data-color="#10b981" style="background: #10b981;" title="Emerald"></button>
                <button class="color-preset" data-color="#0ea5e9" style="background: #0ea5e9;" title="Sky"></button>
                <button class="color-preset" data-color="#8b5cf6" style="background: #8b5cf6;" title="Violet"></button>
                <input type="color" id="color-picker" class="color-picker" value="#E32727" title="Custom color">
            </div>

            <span class="wb-panel-divider"></span>

            <div class="wb-stroke-row">
                <label class="wb-panel-label">Stroke</label>
                <input type="range" id="stroke-width" class="stroke-slider" min="1" max="20" value="2">
                <span id="stroke-value" class="stroke-value">2px</span>
            </div>
        </div>

        <!-- Bottom-right: canvas navigation (pan + zoom) -->
        <div class="wb-float wb-controls">
            <div class="wb-dpad">
                <button class="wb-ctrl-btn wb-pan-up" id="pan-up" title="Pan up">↑</button>
                <button class="wb-ctrl-btn wb-pan-left" id="pan-left" title="Pan left">←</button>
                <button class="wb-ctrl-btn wb-ctrl-center" id="fit-btn" title="Fit page to screen">⤢</button>
                <button class="wb-ctrl-btn wb-pan-right" id="pan-right" title="Pan right">→</button>
                <button class="wb-ctrl-btn wb-pan-down" id="pan-down" title="Pan down">↓</button>
            </div>
            <span class="wb-stylebar-divider"></span>
            <div class="wb-zoom">
                <button class="wb-ctrl-btn" id="zoom-out" title="Zoom out (Ctrl + scroll)">−</button>
                <button class="wb-zoom-level" id="zoom-level" title="Reset to 100%">100%</button>
                <button class="wb-ctrl-btn" id="zoom-in" title="Zoom in (Ctrl + scroll)">+</button>
            </div>
        </div>

        <!-- Challenge card (shown when opened from the Dojo) — anchored under top-right -->
        <section class="wb-float wb-challenge" id="whiteboard-challenge-section" style="display: none;">
            <div class="wb-challenge-top">
                <h3 class="challenge-title">Your Challenge</h3>
                <div class="wb-challenge-actions">
                    <button class="wb-mini-btn" id="challenge-minimize" title="Minimize">–</button>
                    <button class="wb-mini-btn" id="challenge-close" title="Close challenge">✕</button>
                </div>
            </div>
            <div class="timer-input-group-compact">
                <button class="timer-adjust-btn-compact" id="decrease-timer-btn-wb">−</button>
                <div class="timer-display-large" id="timer-display-large">20:00</div>
                <button class="timer-adjust-btn-compact" id="increase-timer-btn-wb">+</button>
            </div>
            <div class="challenge-details" id="challenge-details">
                <!-- Challenge will be populated by JavaScript -->
            </div>
            <div class="timer-controls">
                <button class="button button-primary timer-control-btn" id="start-btn">Start</button>
                <button class="button button-secondary timer-control-btn" id="pause-btn">Pause</button>
                <button class="button button-secondary timer-control-btn" id="reset-btn">Reset</button>
            </div>
        </section>
    </div>

    <script src="../js/whiteboard.js"></script>
</body>
</html>
